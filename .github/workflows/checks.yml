name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Spec checks
        run: node tests/spec-check.mjs
      - name: Service worker is stamped for this release
        run: node tools/stamp-sw.mjs --check
